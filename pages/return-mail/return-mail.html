<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Return Mail Generator</title>
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/mail-shared.css">
<link rel="stylesheet" href="return-mail.css">
</head>
<body>
<div class="page-content">

  <div class="page-head">

    <div>

      <h1 class="page-title">
        Return Mail
      </h1>

      <p class="page-sub">
        Generate return parcel transfer mail
      </p>

    </div>

  </div>


  <div class="mail-layout">


    <!-- INPUT -->

    <div class="card mail-form">

      <div class="form-title">
        Return Data
      </div>


      <div class="form-group">

        <label class="form-label">
          Mail Date
        </label>

        <input
          type="date"
          class="form-input"
          id="returnDate"
        >

      </div>


      <div class="form-group">

        <label class="form-label">
          Return Data
        </label>

        <textarea
          class="form-textarea"
          id="returnInput"
          placeholder="Paste your return data here..."
        ></textarea>

      </div>


      <div class="form-actions">

        <button
          class="btn btn-primary"
          id="generateReturnBtn"
        >
          Generate Mail
        </button>

        <button
          class="btn btn-light"
          id="clearReturnBtn"
        >
          Clear
        </button>

      </div>

    </div>


    <!-- PREVIEW -->

    <div class="card mail-preview">

      <div class="preview-top">

        <div class="preview-title">
          Mail Preview
        </div>

        <div class="preview-badge">
          Gmail Ready
        </div>

      </div>


      <div
        class="email-paper"
        id="returnPreview"
      >
        <span style="color:#98a2b3">
          Preview will appear here
        </span>
      </div>


      <div class="form-actions">

        <button
          class="btn btn-primary"
          id="openReturnGmail"
          style="display:none"
        >
          Open Gmail
        </button>

        <button
          class="btn btn-light"
          id="copyReturnBtn"
          style="display:none"
        >
          Copy Mail
        </button>

      </div>

    </div>

  </div>


</div>
<script src="../../assets/js/common.js"></script>
<script src="return-mail.js"></script>
</body>
</html>
